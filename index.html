
<style>
:root {
  --bg:#090909;
  --panel:#141414;
  --panel2:#1c1c1c;
  --line:#303030;
  --text:#eeeeec;
  --muted:#92918d;
  --green:#829486;
  --red:#a47777;
  --gold:#b69b67;
  --silver:#c8c8c5;
  --radius:18px;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding:env(safe-area-inset-top) 0 calc(92px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}

button,input,select,textarea { font:inherit; }
button { cursor:pointer; }

.app {
  max-width:680px;
  margin:auto;
  padding:22px 17px;
}

header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:9px 0 28px;
}

.brand {
  font-family:Georgia,"Times New Roman",serif;
  font-size:25px;
  font-weight:500;
  letter-spacing:3.5px;
  color:#e4e4e1;
}

.tagline {
  color:var(--gold);
  font-size:8px;
  letter-spacing:2.4px;
  margin-top:7px;
}

.header-date {
  font-size:10px;
  color:var(--muted);
  text-align:right;
  letter-spacing:.4px;
}

h1 {
  font-family:Georgia,"Times New Roman",serif;
  font-size:31px;
  font-weight:400;
  margin:13px 0 7px;
  letter-spacing:-.5px;
}

h2 {
  font-family:Georgia,"Times New Roman",serif;
  font-size:19px;
  font-weight:400;
  margin:0 0 15px;
}

h3 {
  font-size:11px;
  font-weight:650;
  letter-spacing:2px;
  margin:0 0 14px;
  color:#d5d4d0;
}

p { line-height:1.6; }
.muted { color:var(--muted); }
.small { font-size:11px; }

.card {
  background:linear-gradient(145deg,#181818,#111111);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
  margin:13px 0;
  box-shadow:0 8px 25px rgba(0,0,0,.13);
}

.hero {
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,#242321 0%,#171717 48%,#101010 100%);
  border:1px solid #45413a;
  padding:23px 20px;
}

.hero:after {
  content:"";
  position:absolute;
  width:155px;
  height:155px;
  right:-65px;
  top:-75px;
  border:1px solid rgba(182,155,103,.15);
  border-radius:50%;
  pointer-events:none;
}

.hero-top {
  display:flex;
  justify-content:space-between;
  gap:12px;
  position:relative;
  z-index:1;
}

.eyebrow {
  font-size:9px;
  letter-spacing:2.3px;
  color:var(--gold);
}

.year-number {
  font-family:Georgia,"Times New Roman",serif;
  font-size:42px;
  font-weight:400;
  margin-top:7px;
  letter-spacing:-1px;
}

.total-number {
  font-family:Georgia,"Times New Roman",serif;
  font-size:28px;
  font-weight:400;
  color:#e4e2dc;
}

.progress-track {
  height:4px;
  background:#393735;
  border-radius:20px;
  overflow:hidden;
  margin:19px 0 10px;
}

.progress-fill {
  height:100%;
  width:0;
  background:linear-gradient(90deg,#82765f,#d4c5a5);
  border-radius:20px;
  transition:width .2s;
}

.progress-meta {
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:10px;
  letter-spacing:.3px;
}

.section-title {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:29px 2px 10px;
}

.section-title span {
  font-size:9px;
  color:var(--gold);
  letter-spacing:1.8px;
}

.habit-row {
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 0;
  border-bottom:1px solid #292929;
}

.habit-row:last-child { border-bottom:0; }

.habit-icon {
  font-size:18px;
  width:27px;
  text-align:center;
  filter:saturate(.65);
}

.habit-name {
  flex:1;
  font-size:13px;
  letter-spacing:.1px;
}

.habit-sub {
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:5px;
}

.check {
  appearance:none;
  width:24px;
  height:24px;
  flex:none;
  border:1px solid #66635d;
  border-radius:50%;
  background:transparent;
  display:grid;
  place-items:center;
  margin:0;
  transition:all .2s;
}

.check:checked {
  background:var(--gold);
  border-color:var(--gold);
}

.check:checked:after {
  content:"✓";
  color:#111;
  font-size:13px;
  font-weight:900;
}

.group-label {
  font-size:9px;
  letter-spacing:2.5px;
  color:var(--gold);
  margin-bottom:5px;
}

.weekly-row {
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 0;
  border-bottom:1px solid #292929;
}

.weekly-row:last-child { border:0; }

.weekly-info {
  flex:1;
  font-size:13px;
}

.weekly-count {
  font-size:11px;
  color:#d0c1a1;
  letter-spacing:.5px;
}

.pill {
  display:inline-block;
  border:1px solid #5a5141;
  color:#c3ae86;
  border-radius:30px;
  padding:5px 10px;
  font-size:9px;
  letter-spacing:1px;
}

.primary,.secondary,.danger {
  border:0;
  border-radius:12px;
  padding:13px 15px;
  font-weight:650;
  font-size:11px;
  letter-spacing:1.1px;
  transition:all .2s;
}

.primary {
  background:linear-gradient(135deg,#d0c1a1,#a58d62);
  color:#111;
}

.secondary {
  background:#202020;
  color:#e4e2dc;
  border:1px solid #44413b;
}

.danger {
  background:#382323;
  color:#e8b4b4;
}

button:disabled { opacity:.4; }
.full { width:100%; }

input,select,textarea {
  width:100%;
  background:#101010;
  color:var(--text);
  border:1px solid #393939;
  border-radius:11px;
  padding:12px;
  outline:none;
  margin:6px 0 12px;
  font-size:13px;
}

input:focus,select:focus,textarea:focus {
  border-color:var(--gold);
}

textarea {
  min-height:75px;
  resize:vertical;
}

label {
  font-size:10px;
  color:var(--muted);
  letter-spacing:.3px;
}

.form-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.tabs {
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:3px 0 13px;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar { display:none; }

.tab {
  background:#151515;
  color:var(--muted);
  border:1px solid #303030;
  border-radius:30px;
  padding:10px 15px;
  font-size:10px;
  letter-spacing:1px;
  white-space:nowrap;
}

.tab.active {
  background:#d0c1a1;
  color:#111;
  border-color:#d0c1a1;
  font-weight:750;
}

.page { display:none; }
.page.active { display:block; }

.day-selector {
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  margin:15px 0;
}

.day-btn {
  background:#1b1b1b;
  color:var(--muted);
  border:1px solid var(--line);
  border-radius:10px;
  padding:11px 2px;
  font-size:9px;
}

.day-btn.active {
  background:var(--gold);
  color:#111;
  border-color:var(--gold);
  font-weight:800;
}

.exercise {
  border:1px solid var(--line);
  border-radius:13px;
  padding:14px;
  margin:9px 0;
  background:#151515;
}

.exercise-top {
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.exercise-name {
  font-weight:650;
  font-size:13px;
}

.exercise-details {
  color:var(--muted);
  font-size:10px;
  line-height:1.8;
  margin-top:8px;
}

.exercise-actions {
  display:flex;
  gap:6px;
}

.mini-btn {
  border:1px solid var(--line);
  color:#c4c1b9;
  background:#202020;
  border-radius:8px;
  padding:7px 9px;
  font-size:9px;
  letter-spacing:.5px;
}

.history-item {
  padding:13px 0;
  border-bottom:1px solid var(--line);
}

.history-item:last-child { border:0; }

.goal-row {
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 0;
  border-bottom:1px solid var(--line);
}

.goal-row span {
  flex:1;
  font-size:12px;
}

.calendar-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.calendar-head strong {
  font-size:11px;
  letter-spacing:1.5px;
  color:#d6c8aa;
}

.calendar-grid {
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}

.calendar-day {
  aspect-ratio:1;
  display:grid;
  place-items:center;
  border-radius:8px;
  font-size:10px;
  color:var(--muted);
  background:#202020;
}

.calendar-day.empty { background:transparent; }
.calendar-day.done { background:#34463a; color:#d3e5d7; }
.calendar-day.missed { background:#503333; color:#f0caca; }

.calendar-day.today {
  outline:1px solid var(--gold);
  outline-offset:1px;
  color:white;
}

.legend {
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  font-size:9px;
  color:var(--muted);
  margin-top:15px;
}

.dot {
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  margin-right:5px;
}

.notice {
  border-left:2px solid var(--gold);
  padding:13px;
  background:#211e18;
  border-radius:8px;
  margin:13px 0;
}

.notice strong {
  font-size:11px;
  letter-spacing:.5px;
  color:#d5c29c;
}

.notice p {
  color:#c5c0b5;
  font-size:11px;
  margin:8px 0 0;
}

.duo-status {
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:11px 0;
  border-bottom:1px solid var(--line);
  font-size:11px;
}

.status-wait { color:var(--muted); }
.status-done { color:#b9d3be; }

.empty {
  color:var(--muted);
  font-size:11px;
  text-align:center;
  padding:24px 8px;
}

.nav {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:5;
  display:flex;
  justify-content:center;
  gap:5px;
  background:rgba(10,10,10,.96);
  border-top:1px solid #303030;
  padding:10px 7px calc(10px + env(safe-area-inset-bottom));
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.nav button {
  flex:1;
  max-width:130px;
  border:0;
  background:transparent;
  color:var(--muted);
  font-size:9px;
  letter-spacing:.7px;
  padding:8px 2px;
  border-radius:10px;
}

.nav button.active {
  background:#24221e;
  color:#d5c29c;
}

.nav-icon {
  display:block;
  font-size:17px;
  margin-bottom:4px;
}

hr {
  border:0;
  border-top:1px solid var(--line);
  margin:18px 0;
}

@media(min-width:600px) {
  .app { padding:28px; }
}
</style>
